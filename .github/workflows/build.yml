name: Desktop build and tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test and publish desktop only
        shell: pwsh
        run: |
          ./scripts/Test-Signing.ps1
          ./scripts/Build.ps1 -Publish
      - name: Package unsigned review build
        shell: pwsh
        run: ./scripts/Pack.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-desktop-review
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 7
# This workflow never signs, releases, deploys or accesses signing secrets.
