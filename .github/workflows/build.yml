name: Desktop build and tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Test and publish desktop only
        shell: pwsh
        run: ./scripts/Build.ps1 -Publish
      - name: Package unsigned review build
        shell: pwsh
        run: ./scripts/Pack.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-desktop-review
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 7
# This workflow never signs, releases, deploys or accesses signing secrets.
